<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coverland 3PL 창고관리</title>
<meta name="robots" content="noindex">
<style>
:root{
  --teal:#0b7a82; --teal-d:#075e65; --teal-l:#cde8ea; --teal-row:#c7ecef;
  --bg:#ffffff; --panel:#f4f5f6; --ink:#1f2328; --muted:#6b7280; --line:#d9dde1;
  --grid-h:#a8adb2; --grid-alt:#f5f5f5; --side:#f7f7f7; --top:#1e1e1e; --brand:#e5368f;
  --ok:#15803d; --ok-bg:#e3f5e9; --warn:#b45309; --warn-bg:#fff2dd; --bad:#c62828; --bad-bg:#fdeaea;
  --hold:#6d3fc0; --hold-bg:#efe8fb; --blue:#1d5fd1; --blue-bg:#e6eefc;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Open Sans","Segoe UI",-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h2{font-size:1.15rem;margin:0 0 12px} h3{font-size:.95rem;margin:0 0 10px}
.hidden{display:none!important}
.muted{color:var(--muted)} .small{font-size:.85em} .mono{font-family:Consolas,Menlo,monospace}
label{display:block;font-size:.8rem;color:#333;margin-bottom:3px}
label .req{color:var(--bad)}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid #c4c9ce;border-radius:3px;background:#fff;min-height:38px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--teal-l);border-color:var(--teal)}
input[readonly],input:disabled,select:disabled{background:#f1f2f3;color:#444}
input.scan{font-family:Consolas,Menlo,monospace;background:#fbfeff;border:2px dashed #7fc3c8}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.row>*{flex:1 1 170px}
.fx0{flex:0 0 auto!important}

/* 버튼 (알약 모양 청록색) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 18px;min-height:38px;border-radius:999px;border:1px solid var(--teal);background:var(--teal);color:#fff;cursor:pointer;font-weight:700;white-space:nowrap;font-size:.95rem}
.btn:hover{background:var(--teal-d)}
.btn:disabled{background:var(--teal-l);border-color:var(--teal-l);color:#fff;cursor:not-allowed}
.btn.ghost{background:#fff;color:#222;border-color:#b9bfc4}
.btn.ghost:hover{background:#f3f4f5}
.btn.cancel{background:#fff;color:#e8590c;border-color:#e8590c}
.btn.danger{background:#fff;color:var(--bad);border-color:#efb3b3}
.btn.danger:disabled{background:#f8d7d7;border-color:#f8d7d7;color:#fff}
.btn.hold{background:var(--hold);border-color:var(--hold)}
.btn.okc{background:var(--ok);border-color:var(--ok)}
.btn.sm{padding:5px 12px;min-height:30px;font-size:.82rem}
.btn.big{min-height:52px;font-size:1.05rem;width:100%}
.btn .car::after{content:"▾";font-size:.8em;margin-left:2px}
.btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* 드롭다운 메뉴 */
.menu-pop{position:absolute;z-index:80;background:#fff;border:1px solid #d5d9dd;box-shadow:0 6px 18px rgba(0,0,0,.15);min-width:210px;padding:4px 0;border-radius:3px}
.menu-pop button{display:block;width:100%;text-align:left;padding:9px 16px;border:none;background:none;cursor:pointer;font-size:.95rem;color:#333}
.menu-pop button:hover{background:var(--teal);color:#fff}
.menu-pop button:disabled{color:#bbb;background:none;cursor:not-allowed}
.menu-pop .sep{border-top:1px solid #eee;margin:4px 0}

/* 배지 */
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.75rem;font-weight:700;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok)} .b-warn{background:var(--warn-bg);color:var(--warn)}
.b-bad{background:var(--bad-bg);color:var(--bad)} .b-hold{background:var(--hold-bg);color:var(--hold)}
.b-gray{background:#eceef0;color:#4b5563} .b-blue{background:var(--blue-bg);color:var(--blue)} .b-teal{background:var(--teal-l);color:var(--teal-d)}

/* 그리드 (표) */
.grid-box{border:1px solid #cfd3d7;border-radius:3px;background:#fff}
.grid-bar{background:#d3d6d9;padding:7px 12px;font-size:.78rem;color:#4b5156;display:flex;gap:14px;align-items:center;flex-wrap:wrap;text-transform:uppercase;letter-spacing:.2px}
.grid-bar b{color:#333}
.grid-bar .sep{width:1px;height:14px;background:#9aa0a5}
.table-wrap{overflow:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 11px;text-align:left;white-space:nowrap;font-size:.9rem}
th{background:var(--grid-h);color:#111;font-weight:700;position:sticky;top:0;z-index:1;border-right:1px solid #bfc3c7}
tbody tr:nth-child(even) td{background:var(--grid-alt)}
tbody tr.sel td{background:var(--teal-row)!important;font-weight:700}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:#e8f6f7}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.c,th.c{text-align:center}

/* 섹션 박스 */
.section{border:1px solid #e1e4e7;background:#fff;margin-bottom:14px}
.section>.sh{padding:10px 14px;border-bottom:1px solid #e9ebed;font-weight:600;font-size:.9rem;letter-spacing:.3px;text-transform:uppercase;color:#333;display:flex;justify-content:space-between;align-items:center}
.section>.sb{padding:14px}
.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 18px}
.formgrid .span2{grid-column:span 2}
@media (max-width:760px){.formgrid{grid-template-columns:1fr 1fr}.formgrid .span2{grid-column:span 2}}
@media (max-width:460px){.formgrid{grid-template-columns:1fr}.formgrid .span2{grid-column:auto}}

/* 탭 (알약 그룹) */
.pilltabs{display:inline-flex;border:1px solid #b9bfc4;border-radius:999px;overflow:hidden;flex-wrap:wrap}
.pilltabs button{border:none;border-right:1px solid #b9bfc4;background:#fff;padding:8px 14px;font-weight:600;cursor:pointer;font-size:.9rem}
.pilltabs button:last-child{border-right:none}
.pilltabs button.on{background:var(--teal);color:#fff}
.subtabs{display:flex;border-bottom:1px solid #d9dde1;margin-bottom:14px;overflow-x:auto}
.subtabs button{border:1px solid transparent;border-bottom:none;background:none;padding:9px 14px;cursor:pointer;font-size:1rem;color:#333;white-space:nowrap}
.subtabs button.on{border-color:#d9dde1;background:#fff;color:#e8590c;margin-bottom:-1px}

/* ===== 레이아웃 ===== */
.topbar{height:52px;background:var(--top);color:#fff;display:flex;align-items:center;gap:12px;padding:0 14px;position:sticky;top:0;z-index:40}
.topbar .logo{font-weight:800;font-size:1.05rem;display:flex;align-items:center;gap:8px}
.topbar .sp{flex:1}
.topbar .user{display:flex;align-items:center;gap:8px;font-size:.85rem}
.topbar .avatar{width:32px;height:32px;border-radius:50%;background:#9aa0a5;display:flex;align-items:center;justify-content:center;font-weight:700}
.topbar .hamb{display:none;background:none;border:none;color:#fff;font-size:1.4rem;cursor:pointer}
.topbar .out{background:none;border:1px solid #555;color:#fff;border-radius:4px;padding:4px 10px;cursor:pointer}
.shell{display:flex;min-height:calc(100vh - 52px)}
.side{width:210px;flex:0 0 210px;background:var(--side);border-right:1px solid #e3e3e3;display:flex;flex-direction:column}
.side .brandstrip{background:var(--brand);color:#fff;font-weight:700;padding:14px 16px;font-size:.92rem}
.side .mh{background:#4a4a4a;color:#fff;font-weight:700;font-size:1.05rem;padding:12px 16px}
.side nav button{display:flex;align-items:center;gap:12px;width:100%;border:none;background:none;padding:12px 16px;cursor:pointer;color:#333;font-size:1rem;text-align:left}
.side nav button .ic{width:20px;text-align:center}
.side nav button small{color:#888;font-size:.75rem;margin-left:auto}
.side nav button:hover{background:#ececec}
.side nav button.on{background:#e4e4e4;font-weight:700}
.side .foot{margin-top:auto;font-size:.7rem;color:#888;padding:12px 16px}
.filterbar{width:30px;flex:0 0 30px;background:#67b7c0}
.content{flex:1;min-width:0;display:flex;flex-direction:column}
.pagetab{background:#d9d9d9;height:44px;display:flex;align-items:flex-end;padding-left:14px}
.pagetab span{background:#fff;padding:10px 22px;font-size:.95rem;border-radius:3px 3px 0 0}
main{flex:1;padding:16px;min-width:0}
@media (max-width:900px){
  .topbar .hamb{display:block}
  .side{position:fixed;top:52px;bottom:0;left:0;z-index:45;transform:translateX(-100%);transition:transform .2s;box-shadow:4px 0 20px rgba(0,0,0,.2)}
  .side.open{transform:none}
  .filterbar,.pagetab{display:none}
  main{padding:12px}
  .topbar .user .nm{display:none}
}

/* 주문 화면 2단 */
.split{display:grid;grid-template-columns:minmax(430px,1fr) 1.35fr;gap:18px;align-items:start}
.split .pane-r{border-left:1px solid #e1e4e7;padding-left:18px;min-width:0}
.split .pane-l{min-width:0}
.back-btn{display:none}
@media (max-width:1150px){
  .split{grid-template-columns:1fr}
  .split .pane-r{border-left:none;padding-left:0}
  .split.detail .pane-l{display:none}
  .split:not(.detail) .pane-r{display:none}
  .back-btn{display:inline-flex}
}
.empty-r{padding:60px 20px;text-align:center;color:var(--muted);border:2px dashed #e1e4e7;border-radius:6px}
.statusline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:-4px 0 12px}

/* 카드 / KPI */
.card{background:#fff;border:1px solid #e1e4e7;border-radius:4px;padding:16px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid #e1e4e7;border-top:3px solid var(--teal);border-radius:4px;padding:12px 14px}
.kpi .v{font-size:1.6rem;font-weight:800}
.kpi .l{color:var(--muted);font-size:.82rem}
.kpi.warn{border-top-color:var(--warn)} .kpi.bad{border-top-color:var(--bad)} .kpi.hold{border-top-color:var(--hold)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.notice{background:var(--warn-bg);color:var(--warn);border-radius:4px;padding:9px 12px;font-size:.85rem}
.okbox{background:var(--ok-bg);color:var(--ok);border-radius:4px;padding:9px 12px;font-size:.85rem}

/* 로그인 */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(135deg,#0b7a82,#1e1e1e)}
.login-box{width:100%;max-width:430px;background:#fff;border-radius:8px;padding:26px}
.login-box .logo{font-size:1.4rem;font-weight:800;margin-bottom:4px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.role{border:2px solid var(--line);border-radius:8px;padding:14px 10px;text-align:center;cursor:pointer}
.role .ico{font-size:1.8rem}
.role.on{border-color:var(--teal);background:#eef8f9}

/* 피킹 작업 카드 */
.step{border:2px solid var(--line);border-radius:10px;padding:16px;background:#fff}
.step .loc{font-size:2.2rem;font-weight:800;font-family:Consolas,Menlo,monospace;letter-spacing:1px}
.step .item{font-size:1.1rem;font-weight:700}
.progress{height:10px;background:#eceef0;border-radius:99px;overflow:hidden;margin:8px 0 14px}
.progress>i{display:block;height:100%;background:var(--teal)}
.chk{display:inline-block;width:20px;height:20px;border-radius:4px;border:2px solid #c4c9ce;vertical-align:middle}
.chk.done{background:var(--teal);border-color:var(--teal)}

/* 모달 / 토스트 */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:90}
#modal .box{background:#fff;width:100%;max-width:560px;border-radius:12px 12px 0 0;padding:18px;max-height:92vh;overflow:auto}
@media (min-width:640px){#modal{align-items:center}#modal .box{border-radius:8px}}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1e1e1e;color:#fff;padding:11px 18px;border-radius:6px;z-index:99;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast.err{background:var(--bad)} #toast.ok{background:var(--teal)}

/* 인쇄 */
#print-area{display:none}
@media print{
  html,body{background:#fff}
  #app,#login,#modal,#toast,.menu-pop{display:none!important}
  #print-area{display:block}
  @page{size:A4;margin:11mm}
}
.ticket{font-size:11.5px;color:#000;font-family:Arial,"Malgun Gothic",sans-serif}
.ticket+.ticket{page-break-before:always;margin-top:30px}
.ticket table{border:1px solid #000}
.ticket th,.ticket td{border:1px solid #000;padding:5px 6px;font-size:11.5px;white-space:normal;background:#fff!important;font-weight:normal}
.ticket th{background:#e6e6e6!important;font-weight:700;position:static}
.ticket .hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:10px}
.ticket .title{font-size:20px;font-weight:800}
.ticket .sub{font-size:12px;margin-top:2px}
.ticket .info{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;margin:8px 0 12px;border:1px solid #000;padding:8px}
.ticket .info div b{display:inline-block;min-width:92px}
.ticket .box{display:inline-block;width:15px;height:15px;border:1.5px solid #000}
.ticket .locs div{white-space:nowrap}
.ticket .sign{display:flex;gap:20px;margin-top:22px}
.ticket .sign div{flex:1;border-top:1px solid #000;padding-top:4px;text-align:center}
.labels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.label{border:1px dashed #999;padding:8px;text-align:center;page-break-inside:avoid}
.label .big{font-size:18px;font-weight:800;font-family:monospace}
.preview-wrap{background:#fff;border:1px solid #e1e4e7;padding:18px;overflow-x:auto}

/* Extensiv 양식 픽티켓 */
.pt{position:relative;overflow:hidden;font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#000;min-height:900px;display:flex;flex-direction:column}
.pt-title{text-align:center;font:700 26px "Times New Roman",serif}
.pt-rule{border-top:4px solid #000;margin:4px 0 8px}
.pt-top{display:flex;justify-content:space-between;align-items:flex-start;padding:0 20px}
.pt-cust{font:700 26px "Times New Roman",serif;color:#7b0d0d}
.pt-wh{font:700 19px "Times New Roman",serif;color:#7b0d0d}
.pt-txn{font:700 26px "Times New Roman",serif;color:#7b0d0d}
.pt-head{display:grid;grid-template-columns:1.2fr 1.5fr 1.2fr 1.4fr;gap:8px;margin-top:10px;align-items:start;padding-left:4px}
.pt-ship{font-size:12px;line-height:1.25}
.ticket .pt-kv,.pt-kv{border:none!important;width:auto}
.ticket .pt-kv th,.ticket .pt-kv td{border:none!important;padding:0 3px;font-size:12px;background:none!important;white-space:nowrap}
.ticket .pt-kv th{text-align:right;font-weight:700}
.ticket .pt-kv td{color:#7b0d0d;font:700 12px "Times New Roman",serif}
.pt-bc{text-align:right}
.pt-refline{color:#7b0d0d;font:700 12px "Times New Roman",serif;margin:16px 0 6px;text-align:center}
.pt-notes{font-size:15px;margin:10px 0 12px 6px}
.ticket .pt-tbl{border-collapse:collapse;width:100%;border:none}
.ticket .pt-tbl th{background:#fde4e4!important;border:1px solid #000;font-weight:400;font-size:12px;text-align:left;vertical-align:top;padding:2px 3px}
.ticket .pt-tbl th.hb{font-weight:700;text-align:center}
.ticket .pt-tbl td{border:none;padding:2px 3px;font-size:12px;background:none!important}
.ticket .pt-tbl tr.pt-main td{border:1px solid #000}
.ticket .pt-tbl tr.pt-det td{background:#dcdcdc!important;font-size:11.5px}
.ticket .pt-tbl tr.pt-det td.nobg{background:none!important}
.ticket .pt-tbl tr.pt-short td{background:#fde4e4!important;color:#7b0d0d;font-weight:700}
.ticket .pt-tbl tr.pt-tot td{border:1px solid #000}
.ticket .pt-tbl tr.pt-tot td.nb{border:none}
.ticket .pt-tbl .r{text-align:right}.ticket .pt-tbl .c{text-align:center}.ticket .pt-tbl .b{font-weight:700}
.pt-foot{margin-top:auto;padding-top:40px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;font-size:14px}
.pt-foot b{display:block;font-size:14px;margin-bottom:8px}
.pt-foot div div{display:flex;align-items:flex-end;gap:8px;margin:12px 0;justify-content:flex-end}
.pt-foot div div span{white-space:nowrap}
.pt-foot div div i{display:inline-block;width:140px;border-bottom:1.5px solid #000}
.pt-wm{position:absolute;left:8%;top:28%;font:900 120px Arial,sans-serif;color:rgba(0,0,0,.09);transform:rotate(-18deg);pointer-events:none;letter-spacing:4px}
.pt-wm2{left:35%;top:55%}
/* 모달 (Extensiv 스타일) */
.mhead{background:#8fa9bd;color:#fff;font-weight:700;padding:16px 22px;margin:-18px -18px 0;border-radius:8px 8px 0 0;letter-spacing:.5px}
.mbody{padding:18px 4px}
.optbox{border:1px solid #e1e4e7;padding:14px}
.radio{display:flex;gap:8px;align-items:baseline;font-size:.98rem;color:#222;margin:8px 0;cursor:pointer}
.radio input{width:18px;min-height:18px;accent-color:var(--teal)}
.radio span{color:#888;font-size:.8rem;margin-left:4px}
.chkline{display:flex;gap:8px;align-items:center;font-size:.98rem;font-weight:700;color:#222;margin-top:12px;cursor:pointer}
.chkline input{width:18px;min-height:18px}
.mfoot{display:flex;justify-content:center;gap:12px;border-top:1px solid #eee;padding-top:16px}

/* 왼쪽 검색 필터 패널 */
.ol{display:flex;gap:14px;align-items:flex-start}
.olist{flex:1;min-width:0}
.fpanel{flex:0 0 260px;width:260px;display:flex;background:#fff}
.fstrip{flex:0 0 26px;border:none;background:#67b7c0;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 0;min-height:420px}
.fstrip em{writing-mode:vertical-rl;font-style:normal;font-size:.75rem;letter-spacing:1px;color:#e9f6f7}
.fbody{flex:1;padding-left:10px;min-width:0}
.fsec{border:1px solid #e1e4e7;border-top:3px solid #c9cdd1;padding:10px 12px 12px;margin-bottom:12px}
.fh{font-size:.82rem;font-weight:600;text-transform:uppercase;letter-spacing:.3px;margin-bottom:8px;color:#333}
.ol.fshut .fpanel{flex-basis:26px;width:26px}
.ol.fshut .fbody{display:none}
@media (max-width:900px){.ol{flex-direction:column}.fpanel{width:100%;flex:none}.fstrip{min-height:0;flex-direction:row;flex:0 0 auto;width:100%;padding:8px 12px}.fstrip em{writing-mode:horizontal-tb}.ol:not(.fshut) .fpanel{flex-direction:column}.ol.fshut .fpanel{width:100%}.fbody{padding:10px 0 0}}
.split:not(.detail){grid-template-columns:1fr}.split:not(.detail) .pane-r{display:none}
.olist>div:first-child>.btns{flex:1;min-width:0}
.askov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:120;padding:16px}
.askbox{background:#fff;border-radius:8px;padding:20px;max-width:420px;width:100%}
.askmsg{white-space:pre-line;font-size:1rem;margin-bottom:6px}
.syncb{font-size:.75rem;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.14);color:#fff;white-space:nowrap}
.syncb.ok{background:#1f7a6d}.syncb.busy{background:#8a6d00}.syncb.warn{background:#b23b3b}.syncb:empty{display:none}
@media (max-width:600px){.syncb{font-size:.68rem;padding:2px 7px}}
tbody tr.nostock td{background:#d6e8ff}
tbody tr.nostock.sel td{background:#b9d6fb!important}
tbody tr.nostock:hover td{background:#c6defc}
.nslegend{display:inline-block;width:12px;height:12px;background:#d6e8ff;border:1px solid #9cc3f5;vertical-align:-2px;margin-right:4px}
.langsw{display:flex;justify-content:flex-end;gap:4px;margin:-6px -6px 6px 0}
.langsw button{border:1px solid #ccd;background:#fff;border-radius:999px;padding:3px 12px;font-size:.8rem;cursor:pointer;color:#555}
.langsw button.on{background:var(--teal);border-color:var(--teal);color:#fff}
.topbar .langb{font-size:.78rem;padding:4px 8px;white-space:nowrap}
html[lang=en] #nav small{display:none}
</style>
</head>
<body>

<!-- ============ 로그인 ============ -->
<section id="login">
  <div class="login-box">
    <div class="langsw"><button data-lang="ko">한국어</button><button data-lang="en">English</button></div>

function expBadge(exp) {

}

/* =========================================================

function seed() {

    { client: 'COVERLAND', sku: 'CV-1002', name: '그릭요거트 플레인 400g', barcode: '8801234500028', unit: 'Each', cuft: 0.02, lbs: 0.95, packPer: 12, dimUnit: 'Carton' },

    { client: 'COVERLAND', sku: 'CV-1004', name: '콤부차 레몬 500ml', barcode: '8801234500042', unit: 'Each', cuft: 0.025, lbs: 1.2, packPer: 24, dimUnit: 'Carton' },
    { client: 'COVERLAND', sku: 'CV-1005', name: '닭가슴살 소시지 120g', barcode: '8801234500059', unit: 'Each', cuft: 0.01, lbs: 0.3, packPer: 50, dimUnit: 'Carton' }

  const L = (sku, loc, lot, d, qty, hold, holdReason) => ({

  const stock = [

    L('CV-1002', 'A-02-01', 'Y1101', 4, 40), L('CV-1002', 'A-02-02', 'Y1108', 12, 90), L('CV-1002', 'A-02-03', 'Y1115', 19, 150),
    L('CV-1003', 'B-01-02', 'J0907', 210, 60), L('CV-1003', 'B-01-03', 'J0812', 140, 45),
    L('CV-1004', 'B-02-01', 'K0301', -3, 24), L('CV-1004', 'B-02-02', 'K0322', 45, 200),
    L('CV-1005', 'A-01-03', 'S0501', 33, 80), L('CV-1005', 'HOLD-01', 'S0420', 20, 15, true, '포장 파손')
  ];
  const d = { clients, skus, locations, stock, orders: [], logs: [], favs: [], txnSeq: 9943500, settings: { warehouse: 'Main WH' }, version: 2 };
  // 샘플 주문 2건 (Open 상태)
  d.orders.push(newOrderObj(d, { client: 'COVERLAND', ref: 'MV202611040001', po: 'US-FBA_26110002_OB_206-1', type: 'FBA',
    carrier: { carrier: 'UPS', service: 'UPS Ground', billing: 'Prepaid', account: '', tracking: '', scac: '', notes: '' },
    contact: { code: '', company: 'FBA - ONT8', name: 'Amazon Receiving', phone: '', email: '', addr1: '24300 Nandina Ave', addr2: '', city: 'Moreno Valley', state: 'CA', zip: '92551', country: 'US' },
    lines: [{ sku: 'CV-1001', qty: 150 }, { sku: 'CV-1002', qty: 60 }] }));
  d.orders.push(newOrderObj(d, { client: 'COVERLAND', ref: 'MV202611040002', po: 'B2B-7781', type: 'B2B',
    contact: { code: '', company: '쿠팡 덕평센터', name: '입고담당', phone: '031-000-0000', email: '', addr1: '경기도 이천시 마장면', addr2: '', city: '이천', state: '경기', zip: '17385', country: 'KR' },
    lines: [{ sku: 'CV-1002', qty: 50 }, { sku: 'CV-1005', qty: 30 }, { sku: 'CV-1003', qty: 20 }] }));
  return d;
}
function newOrderObj(d, o) {
  d.txnSeq = Math.max(d.txnSeq || 9943500, ...(d.orders || []).map(x => +x.no || 0)) + 1;
  return Object.assign({
    no: String(d.txnSeq), client: d.clients[0]?.code, warehouse: (d.settings || {}).warehouse || 'Main WH', ref: '', po: '', vendor: '', type: 'Unspecified',
    earliest: '', cancelDate: '', created: nowStr(), createdDate: todayStr(), createdBy: user ? user.name : 'system', status: 'open', notes: '', printCount: 0,
    contact: { code: '', company: '', name: '', phone: '', email: '', addr1: '', addr2: '', city: '', state: '', zip: '', country: 'KR' },
    billing: { same: true, company: '', name: '', phone: '', email: '', addr1: '', addr2: '', city: '', state: '', zip: '', country: '' },
    carrier: { carrier: '', service: '', billing: 'Prepaid', account: '', tracking: '', scac: '', notes: '' },
    charges: [], lines: [], alloc: [], result: []
  }, o);
}
function load() {
  let d = null;
  try { const raw = localStorage.getItem(KEY); if (raw) d = JSON.parse(raw); } catch (e) { }
  if (!d) { d = seed(); try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) { } return d; }
  return migrate(d);
}
function save() { if (SYNC.on) return syncPush(); try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { toast('저장 실패: 브라우저 저장공간을 확인하세요', 'err'); } }
function log(action, detail) {
  db.logs.unshift({ id: uid(), t: Date.now(), ts: nowStr(), user: user ? `${user.name}(${user.role === 'office' ? '사무실' : '현장'})` : '-', action, detail });
  if (db.logs.length > 1000) db.logs.length = 1000;
}

const clientOf = code => db.clients.find(c => c.code === code);
const skuOf = (client, sku) => db.skus.find(s => s.client === client && s.sku === sku);
const skuName = (client, sku) => (skuOf(client, sku) || {}).name || '(미등록)';
const locOf = code => db.locations.find(l => l.code.toUpperCase() === String(code || '').trim().toUpperCase());
const isHoldLoc = code => (locOf(code) || {}).type === 'hold';
const avail = s => s.hold ? 0 : Math.max(0, s.qty - s.reserved);
const shipTo = o => o.contact.company || o.contact.name || o.customer || '';

function findSku(input, client) {
  const v = String(input || '').trim().toUpperCase();
  if (!v) return null;
  return db.skus.find(s => (!client || s.client === client) && (s.sku.toUpperCase() === v || String(s.barcode).toUpperCase() === v)) || null;
}
function putStock(o) {
  const ex = db.stock.find(s => s.client === o.client && s.sku === o.sku && s.loc === o.loc && s.lot === o.lot &&
    s.exp === o.exp && s.hold === !!o.hold && (s.holdReason || '') === (o.holdReason || ''));
  if (ex) { ex.qty += o.qty; return ex; }
  const n = { id: uid(), client: o.client, sku: o.sku, loc: o.loc, lot: o.lot, exp: o.exp, qty: o.qty, reserved: 0, hold: !!o.hold, holdReason: o.holdReason || '' };
  db.stock.push(n); return n;
}
function cleanStock() { db.stock = db.stock.filter(s => s.qty > 0 || s.reserved > 0); }

/* =========================================================
   FEFO 할당 (유통기한 짧은 순서)
   ========================================================= */
function planFEFO(client, lines) {
  const c = clientOf(client) || {};
  const minExp = addDays(Number(c.minDays || 0));
  const used = {}; const plan = []; const result = [];
  for (const ln of lines) {
    let need = ln.qty;
    const cands = db.stock
      .filter(s => s.client === client && s.sku === ln.sku && !s.hold && !isHoldLoc(s.loc) && s.exp >= minExp && avail(s) - (used[s.id] || 0) > 0)
      .sort((a, b) => a.exp.localeCompare(b.exp) || a.loc.localeCompare(b.loc));
    for (const s of cands) {
      if (need <= 0) break;
      const take = Math.min(need, avail(s) - (used[s.id] || 0));
      used[s.id] = (used[s.id] || 0) + take;
      plan.push({ stockId: s.id, sku: s.sku, loc: s.loc, lot: s.lot, exp: s.exp, qty: take, picked: 0, done: false });
      need -= take;
    }
    result.push({ sku: ln.sku, qty: ln.qty, alloc: ln.qty - need, short: need });
  }
  return { plan, result, minExp };
}
function mergedLines(o) {
  const m = {}; o.lines.forEach(l => m[l.sku] = (m[l.sku] || 0) + Number(l.qty || 0));
  return Object.entries(m).filter(([, q]) => q > 0).map(([sku, qty]) => ({ sku, qty }));
}

/* 주문 상태 */
const STATUS = {
  open: ['Open', 'b-gray', '미할당'], allocated: ['Allocated', 'b-teal', '할당완료'], partial: ['Partially Allocated', 'b-warn', '부분할당'],
  picking: ['Picking', 'b-hold', '피킹중'], picked: ['Picked', 'b-blue', '피킹완료'], closed: ['Closed', 'b-ok', '출고완료'], cancelled: ['Cancelled', 'b-bad', '취소']
};
const stBadge = s => `<span class="badge ${STATUS[s][1]}" title="${STATUS[s][2]}">${STATUS[s][0]}</span>`;
const isOpenish = s => !['closed', 'cancelled'].includes(s);

function allocateOrder(o, quiet) {
  if (o.status !== 'open') { if (!quiet) toast(`${o.no}: Open(미할당) 상태에서만 할당할 수 있습니다`, 'err'); return false; }
  const lines = mergedLines(o);
  if (!lines.length) { if (!quiet) toast(`${o.no}: 라인 아이템이 없습니다`, 'err'); return false; }
  const p = planFEFO(o.client, lines);
  if (!p.plan.length) { if (!quiet) toast(`${o.no}: 할당 가능한 재고가 없습니다`, 'err'); return false; }
  p.plan.forEach(a => { db.stock.find(x => x.id === a.stockId).reserved += a.qty; });
  o.alloc = p.plan; o.result = p.result;
  o.status = p.result.some(r => r.short > 0) ? 'partial' : 'allocated';
  log('할당(FEFO)', `${o.no} ${p.result.map(r => `${r.sku} ${r.alloc}/${r.qty}`).join(', ')}`);
  return true;
}

/* 수동 할당: 로케이션·로트·수량을 직접 골라서 할당 (FEFO 대신) */
function manualAllocate(o) {
  if (!['open', 'allocated', 'partial'].includes(o.status)) { toast(`${o.no}: 피킹이 시작된 주문은 할당을 바꿀 수 없습니다`, 'err'); return; }
  const lines = mergedLines(o);
  if (!lines.length) { toast(`${o.no}: 라인 아이템이 없습니다`, 'err'); return; }
  const mine = {}; (o.alloc || []).forEach(a => mine[a.stockId] = (mine[a.stockId] || 0) + a.qty);
  const sugg = {};
  if (o.status === 'open') planFEFO(o.client, lines).plan.forEach(a => sugg[a.stockId] = (sugg[a.stockId] || 0) + a.qty);
  else Object.assign(sugg, mine);
  const c = clientOf(o.client) || {}, minExp = addDays(Number(c.minDays || 0)), today = todayStr();
  const cand = sku => db.stock.filter(st => st.client === o.client && st.sku === sku && !st.hold && !isHoldLoc(st.loc) && st.exp >= today && (avail(st) + (mine[st.id] || 0) > 0))
    .sort((a, b) => a.exp.localeCompare(b.exp) || a.loc.localeCompare(b.loc));
  const body = lines.map((ln, li) => {
    const rows = cand(ln.sku);
    return `<div class="section" style="margin-bottom:12px"><div class="sh" style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap">
      <span><span class="mono">${esc(ln.sku)}</span> · ${esc(skuName(o.client, ln.sku))}</span><span>주문수량 <b>${fmt(ln.qty)}</b> · 선택 <b id="maSum${li}">0</b></span></div>
      <div class="table-wrap"><table><thead><tr><th>Location</th><th>Lot</th><th>Expiration</th><th class="num">Available</th><th class="num" style="width:120px">Pick Qty</th></tr></thead><tbody>
      ${rows.map(st => { const av = avail(st) + (mine[st.id] || 0); return `<tr><td class="mono"><b>${esc(st.loc)}</b></td><td>${esc(st.lot)}</td><td>${st.exp} ${expBadge(st.exp)}${st.exp < minExp ? ' <span class="badge b-warn">최소 잔여 유통기한 미달</span>' : ''}</td>
        <td class="num">${fmt(av)}</td><td class="num"><input class="maQ" data-li="${li}" data-id="${esc(st.id)}" data-max="${av}" type="number" min="0" max="${av}" inputmode="numeric" value="${sugg[st.id] || 0}" style="width:100px;text-align:right"></td></tr>`; }).join('')
        || '<tr><td colspan="5" class="muted">할당할 수 있는 재고가 없어요 (보류·만료 제외)</td></tr>'}
      </tbody></table></div></div>`;
  }).join('');
  openModal(`<div class="mhead">MANUAL ALLOCATE · ${esc(o.no)}</div><div class="mbody">
    <p class="small" style="margin-top:0">로케이션별로 피킹할 수량을 직접 넣으세요. 처음 값은 FEFO 추천이에요. 보류·만료 재고는 목록에 안 나와요.</p>${body}
    <div id="maErr" class="small" style="color:var(--bad)"></div></div>
    <div class="mfoot"><button class="btn cancel" onclick="closeModal()">⊘ Cancel</button><button class="btn ghost" id="maZero">모두 0</button><button class="btn" id="maOk">✔ Save Allocation</button></div>`, () => {
    $('#modalBox').style.maxWidth = '900px';
    const check = () => {
      const sums = lines.map(() => 0); let err = '';
      $$('.maQ').forEach(i => { const v = Number(i.value || 0); const bad = !(v >= 0) || Math.round(v) !== v || v > +i.dataset.max;
        i.style.borderColor = bad ? 'var(--bad)' : ''; if (bad) err = '수량은 0부터 재고 수량까지만 넣을 수 있어요'; else sums[+i.dataset.li] += v; });
      lines.forEach((ln, li) => { const el = $('#maSum' + li); el.textContent = fmt(sums[li]); el.style.color = sums[li] > ln.qty ? 'var(--bad)' : sums[li] === ln.qty ? 'var(--teal)' : '';
        if (sums[li] > ln.qty) err = `${ln.sku}: 주문 수량보다 많이 잡을 수 없어요`; });
      $('#maErr').textContent = err; $('#maOk').disabled = !!err; return { sums, err };
    };
    $$('.maQ').forEach(i => i.oninput = check); check();
    $('#maZero').onclick = () => { $$('.maQ').forEach(i => i.value = 0); check(); };
    $('#maOk').onclick = () => {
      const { sums, err } = check(); if (err) return;
      const real = db.orders.find(x => x.no === o.no); if (!real || !['open', 'allocated', 'partial'].includes(real.status)) return toast('주문 상태가 바뀌었어요. 다시 열어주세요', 'err');
      (real.alloc || []).forEach(a => { const st = db.stock.find(x => x.id === a.stockId); if (st) st.reserved = Math.max(0, st.reserved - a.qty); });
      const plan = [];
      $$('.maQ').forEach(i => { const q = Number(i.value || 0); if (q <= 0) return; const st = db.stock.find(x => x.id === i.dataset.id); if (!st) return;
        st.reserved += q; plan.push({ stockId: st.id, sku: st.sku, loc: st.loc, lot: st.lot, exp: st.exp, qty: q, picked: 0, done: false }); });
      real.alloc = plan;
      real.result = lines.map((ln, li) => ({ sku: ln.sku, qty: ln.qty, alloc: sums[li], short: ln.qty - sums[li] }));
      real.status = !plan.length ? 'open' : real.result.some(r => r.short > 0) ? 'partial' : 'allocated';
      if (!plan.length) real.result = [];
      cleanStock();
      log('할당(수동)', `${real.no} ${plan.map(a => `${a.sku}@${a.loc} ${a.qty}`).join(', ') || '없음'}`);
      save(); closeModal(); if (OS.cur && OS.cur.no === real.no) { OS.cur = clone(real); OS.curTab = 'lines'; }
      if ($('#paneL')) { renderList(); renderDetail(); }

const C128 = ["212222","222122","222221","121223","121322","131222","122213","122312","132212","221213","221312","231212","112232","122132","122231","113222","123122","123221","223211","221132","221231","213212","223112","312131","311222","321122","321221","312212","322112","322211","212123","212321","232121","111323","131123","131321","112313","132113","132311","211313","231113","231311","112133","112331","132131","113123","113321","133121","313121","211331","231131","213113","213311","213131","311123","311321","331121","312113","312311","332111","314111","221411","431111","111224","111422","121124","121421","141122","141221","112214","112412","122114","122411","142112","142211","241211","221114","413111","241112","134111","111242","121142","121241","114212","124112","124211","411212","421112","421211","212141","214121","412121","111143","111341","131141","114113","114311","411113","411311","113141","114131","311141","411131","211412","211214","211232","2331112"];
function barcodeSVG(text, h = 46, scale = 1.4) {
  const codes = [104];
  for (const ch of String(text)) { const c = ch.charCodeAt(0) - 32; if (c >= 0 && c <= 94) codes.push(c); }
  let sum = 104; for (let i = 1; i < codes.length; i++) sum += codes[i] * i;
  codes.push(sum % 103); codes.push(106);
  let x = 10, r = '';
  for (const c of codes) { const p = C128[c]; for (let i = 0; i < p.length; i++) { const w = +p[i]; if (i % 2 === 0) r += `<rect x="${x}" y="0" width="${w}" height="${h}"/>`; x += w; } }
  const W = x + 10;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${h}" width="${Math.round(W * scale)}" height="${h}" shape-rendering="crispEdges"><rect width="${W}" height="${h}" fill="#fff"/><g fill="#000">${r}</g></svg>`;
}

function saveOrder() {

    db.favs = db.favs.filter(f => f.label !== label); db.favs.push({ label, contact: clone(o.contact) }); delete o.addFav;

function lineForm(o, idx) {

    <div class="small" id="lfH" style="margin:4px 0"></div>

    <div style="height:14px"></div><div class="btns" style="justify-content:flex-end"><button class="btn ghost" onclick="closeModal()">취소</button><button class="btn" id="lfOk">확인</button></div>`, () => {
    const hint = () => { const k = findSku($('#lfS').value, o.client);

      const av = planFEFO(o.client, [{ sku: k.sku, qty: 1e12 }]).result[0].alloc;
      $('#lfH').innerHTML = `✔ ${esc(k.name)} · 출고가능 재고 <b>${fmt(av)}</b>`; };
    $('#lfS').oninput = hint; hint();
    enterChain(['lfS', 'lfQ'], () => $('#lfOk').click());
    $('#lfOk').onclick = () => {
      const k = findSku($('#lfS').value, o.client), q = parseInt($('#lfQ').value);

      if (idx === null) { const ex = o.lines.find(x => x.sku === k.sku); ex ? ex.qty += q : o.lines.push({ sku: k.sku, qty: q }); } else o.lines[idx].qty = q;
      OS.dirty = true; closeModal(); renderDetail(); toast('반영됨 · Save 를 눌러 저장하세요');

}

/* 여러 주문 엑셀 붙여넣기 */
function importOrders() {
  openModal(`<h3>Mass Order Import</h3>
    <p class="small muted">엑셀에서 아래 순서의 5칸을 복사해 붙여넣으세요. 같은 Reference Number 줄은 한 주문으로 묶입니다.<br><b>Reference Number · 배송처(Company) · PO · SKU(또는 바코드) · 수량</b></p>
    <textarea id="imT" rows="10" class="mono" placeholder="MV001	쿠팡 덕평	PO-1	CV-1001	50&#10;MV001	쿠팡 덕평	PO-1	CV-1002	20&#10;MV002	마켓컬리	PO-2	CV-1005	10" autofocus></textarea>
    <label style="margin-top:8px;display:flex;gap:8px;align-items:center"><input type="checkbox" id="imA" style="width:18px;min-height:18px" checked> 만든 뒤 바로 FEFO 할당하기</label>
    <div id="imR" class="small"></div>
    <div style="height:12px"></div><div class="btns" style="justify-content:flex-end"><button class="btn ghost" onclick="closeModal()">취소</button><button class="btn" id="imOk">Import</button></div>`, () => {
    $('#imOk').onclick = () => {
      const client = db.clients[0].code, groups = {}, bad = [];
      $('#imT').value.split(/\r?\n/).map(s => s.trim()).filter(Boolean).forEach(line => {
        const p = line.split('\t').length >= 5 ? line.split('\t') : line.split(',');
        const [ref, comp, po, s, q] = p.map(x => (x || '').trim()); const k = findSku(s, client); const qty = parseInt(String(q).replace(/,/g, ''));
        if (!ref || !k || !(qty > 0)) { bad.push(line); return; }
        (groups[ref] = groups[ref] || { ref, comp, po, lines: [] }).lines.push({ sku: k.sku, qty });
      });
      if (bad.length) { $('#imR').innerHTML = `<span style="color:var(--bad)">인식 못한 줄 ${bad.length}개: ${bad.slice(0, 3).map(esc).join(' / ')}</span>`; return; }
      let n = 0; Object.values(groups).forEach(g => {
        const o = newOrderObj(db, { client, ref: g.ref, po: g.po, lines: g.lines });
        o.contact.company = g.comp; db.orders.push(o); n++; log('주문 생성 (Import)', `${o.no} ${g.ref}`);
        if ($('#imA').checked) allocateOrder(o, true);
      });
      save(); closeModal(); renderList(); toast(`${n}건 주문 생성`, 'ok');
    };
  });
}

/* ---------- Extensiv 양식 픽티켓 ---------- */
const mdy = s => { if (!s) return ''; const [y, m, d] = String(s).split('-'); return d ? `${+m}/${+d}/${y}` : esc(s); };
const n3 = v => { const x = Number(v || 0); if (!x) return ''; return x.toFixed(3).replace(/^0\./, '.'); };
const dimQty = (k, q) => Math.ceil(q / Math.max(1, Number(k.packPer) || 1));
function ptHeader(o, title, poRight) {
  const c = o.contact, cr = o.carrier, cl = clientOf(o.client) || { name: o.client };
  const kv = rows => `<table class="pt-kv">${rows.map(([k, v]) => `<tr><th>${k} :</th><td>${v ? esc(v) : ''}</td></tr>`).join('')}</table>`;
  const mid = [['Reference #', o.ref], ['Vendor #', o.vendor]].concat(poRight ? [] : [['PO #', o.po]]).concat([['Entered Date', mdy(o.createdDate)], ['Earliest Ship Date', mdy(o.earliest)], ['Cancel Date', mdy(o.cancelDate)]]);
  const right = [['Carrier', cr.carrier], ['Service', cr.service], ['Billing', cr.billing === 'Prepaid' && !cr.carrier ? '' : cr.billing], ['Account #', cr.account]].concat(poRight ? [['PO #', o.po]] : []);
  return `${title ? `<div class="pt-title">${title}</div><div class="pt-rule"></div>` : ''}
    <div class="pt-top"><div><div class="pt-cust">${esc(cl.name)}</div><div class="pt-wh">Warehouse: ${esc(o.warehouse)}</div></div><div class="pt-txn">Transaction # : ${esc(o.no)}</div></div>
    <div class="pt-head">
      <div class="pt-ship">Ship To<br>${esc(c.company)}<br>${c.name ? esc(c.name) + '<br>' : '<br>'}${esc(c.addr1)}${c.addr2 ? '<br>' + esc(c.addr2) : ''}<br><br><span style="display:inline-block;min-width:110px">${esc(c.city)}</span>${esc(c.state)} &nbsp;${esc(c.zip)}</div>
      ${kv(mid)}
      <div>${kv(right)}</div>
      <div class="pt-bc">${barcodeSVG(o.no, 30, 0.9)}<div class="pt-refline">${esc(o.ref)}</div>${o.ref ? barcodeSVG(o.ref, 52, 1.05) : ''}</div>
    </div>
    <div class="pt-notes">Notes : ${esc(o.notes || '')}</div>`;
}
function ptFooter() {
  const ln = l => `<div><span>${l}:</span><i></i></div>`;
  return `<div class="pt-foot"><div><b>MATERIALS</b>${ln('LABELS')}${ln('PALLETS')}${ln('BOXES')}</div><div><b>U.O.M. SHIPPED</b>${ln('UNIT')}${ln('INNER')}${ln('CARTON')}</div><div><b>&nbsp;</b>${ln('Picked by')}${ln('Checked by')}${ln('Loaded by')}</div></div>`;
}
const wm = dup => dup ? '<div class="pt-wm">Duplicate</div><div class="pt-wm pt-wm2">Duplicate</div>' : '';
const COLS = ['Qualifier', 'Item Description', 'Ordered Unit of Measure', 'Qty Ord', 'Qty Shipd', 'Cu Ft', 'Lbs', 'Packed per Dim UoM', 'Total Qty Dim UoM', 'Dim Unit of Measure'];
const detailRow = (a, k, span) => `<tr class="pt-det"><td colspan="${span}">Details: Loc: ${esc(a.loc)} Lot#: ${esc(a.lot)}<br>Exp Date: ${mdy(a.exp)}</td><td colspan="2">Qty (${esc(k.unit || 'Each')}): ${fmt(a.qty)}</td><td colspan="3"></td><td class="r">${n3((k.cuft || 0) * a.qty)}</td><td></td><td></td><td class="r">${dimQty(k, a.qty)}</td><td></td></tr>`;

/* 기본 Pick Ticket (SKU 줄 + 로케이션 상세) — mode: std | over | short */
function pickTicketHTML(o, mode, dup) {
  const res = {}; (o.result || []).forEach(r => res[r.sku] = r);
  let lines = mergedLines(o);
  if (mode === 'short') lines = lines.filter(l => (res[l.sku] || {}).short > 0);
  let tq = 0, tc = 0, td = 0;
  const body = lines.map(l => {
    const k = skuOf(o.client, l.sku) || {}; const al = o.alloc.filter(a => a.sku === l.sku);
    const allocQ = al.reduce((s, a) => s + a.qty, 0); const short = l.qty - allocQ;
    const q = mode === 'short' ? allocQ : l.qty; const cu = (k.cuft || 0) * q; const dq = dimQty(k, q);
    tq += q; tc += cu; td += dq;
    return `<tr class="pt-main"><td>${esc(l.sku)}</td><td></td><td>${esc(k.name)}</td><td class="c b">${esc(k.unit || 'Each')}</td><td class="c b">${fmt(q)}</td><td></td><td class="r">${n3(cu)}</td><td class="r">${n3((k.lbs || 0) * q)}</td><td class="r">${k.packPer || ''}</td><td class="r">${dq}</td><td>${esc(k.dimUnit || '')}</td></tr>
      ${al.map(a => detailRow(a, k, 2)).join('')}
      ${mode !== 'std' && short > 0 ? `<tr class="pt-det pt-short"><td colspan="11">${mode === 'short' ? `SHORT SHIP — Ordered ${fmt(l.qty)} / Shipping ${fmt(allocQ)} / Short ${fmt(short)}` : `OVERALLOCATED / NOT ALLOCATED — ${fmt(short)} ${esc(k.unit || 'Each')} 재고 없음`}</td></tr>` : ''}`;
  }).join('');
  return `<div class="ticket pt">${wm(dup)}${ptHeader(o, mode === 'short' ? 'Short Ship Pick Ticket' : mode === 'over' ? 'Pick Ticket (with Overallocated)' : 'Pick Ticket', false)}
    <table class="pt-tbl"><thead><tr><th>SKU</th>${COLS.map(c => `<th class="${['Ordered Unit of Measure', 'Qty Ord', 'Qty Shipd'].includes(c) ? 'hb' : ''}">${c}</th>`).join('')}</tr></thead><tbody>${body || '<tr><td colspan="11">해당 라인 없음</td></tr>'}
    <tr class="pt-tot"><td colspan="3" class="r nb">Totals :</td><td></td><td class="c b">${fmt(tq)}</td><td></td><td class="r">${n3(tc)}</td><td></td><td></td><td class="r">${td}</td><td></td></tr></tbody></table>
    ${ptFooter()}</div>`;
}
/* Pick Ticket by Location (로케이션 줄 → SKU 줄 → 로트 상세) */
function pickByLocHTML(o, dup) {
  const groups = {};
  o.alloc.forEach(a => { const g = groups[a.loc + '|' + a.sku] = groups[a.loc + '|' + a.sku] || { loc: a.loc, sku: a.sku, allocs: [] }; g.allocs.push(a); });

    ${ptFooter()}</div>`;
}
/* Master Pick Ticket — 여러 주문 SKU 총수량 */
function masterHTML(orders, dup) {

      ${orders.map(o => `<tr class="pt-main"><td class="b">${esc(o.no)}</td><td>${esc(o.ref)}</td><td>${esc(o.po)}</td><td>${esc(shipTo(o))}</td><td>${esc([o.carrier.carrier, o.carrier.service].filter(Boolean).join(' / '))}</td></tr>`).join('')}</tbody></table>

    <tr class="pt-tot"><td colspan="3" class="r nb">Totals (${orders.length} orders) :</td><td class="c b">${fmt(tq)}</td><td></td><td></td><td class="r">${td}</td><td></td></tr></tbody></table>
    <p style="font-size:10.5px">※ 여러 주문의 같은 SKU를 합산한 총수량입니다. 피킹 후 주문별 분류는 각 주문의 Pick Ticket by Location 을 참고하세요.</p>
    ${ptFooter()}</div>`;

VIEWS.pick = (orderNo) => {
  const open = db.orders.filter(o => ['allocated', 'partial', 'picking'].includes(o.status));
  const o = orderNo ? db.orders.find(x => x.no === orderNo) : null;
  if (!o) {
    $('#view').innerHTML = `<h2>피킹 작업</h2>
      <div class="card"><label>Pick Ticket 바코드 스캔 (Transaction ID)</label><input id="pkScan" class="scan" autocomplete="off" placeholder="예: 9943501"></div>
      ${open.length ? open.map(x => `<div class="card" style="cursor:pointer" data-open="${esc(x.no)}">
        <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b class="mono">${esc(x.no)}</b>${stBadge(x.status)}</div>
        <div>${esc(shipTo(x))} <span class="muted small">· Ref ${esc(x.ref || '-')} · ${esc(x.created)}</span></div>
        <div class="progress"><i style="width:${Math.round(x.alloc.filter(a => a.done).length / x.alloc.length * 100)}%"></i></div>
        <div class="small">${x.alloc.filter(a => a.done).length} / ${x.alloc.length} 줄 완료</div></div>`).join('') : '<div class="card muted">피킹할 주문이 없습니다. 사무실에서 주문을 Allocate 하면 여기에 나타납니다.</div>'}`;
    $$('[data-open]').forEach(c => c.onclick = () => go('pick', c.dataset.open));
    const sc = $('#pkScan'); sc.focus();
    sc.addEventListener('keydown', e => { if (e.key !== 'Enter') return; const v = sc.value.trim().toUpperCase(); const f = open.find(x => x.no.toUpperCase() === v || (x.ref || '').toUpperCase() === v); if (f) go('pick', f.no); else { toast('피킹 대기 주문이 아닙니다', 'err'); sc.select(); } });
    return;
  }
  const order = o.alloc.map((a, i) => ({ a, i })).sort((x, y) => x.a.loc.localeCompare(y.a.loc));
  const next = order.find(x => !x.a.done);
  const doneN = o.alloc.filter(a => a.done).length;
  const k = next ? skuOf(o.client, next.a.sku) : null;
  $('#view').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><h2 style="margin:0">피킹 · <span class="mono">${esc(o.no)}</span></h2><button class="btn ghost sm" id="pkBack">← 목록</button></div>
    <div class="small muted">${esc(shipTo(o))} · Ref ${esc(o.ref || '-')}</div>
    <div class="progress"><i style="width:${Math.round(doneN / o.alloc.length * 100)}%"></i></div>
    ${next ? `<div class="step">
      <div class="small muted">${doneN + 1} / ${o.alloc.length} 번째 · 이 위치로 가세요</div>
      <div class="loc">${esc(next.a.loc)}</div>
      <div class="item">${esc(next.a.sku)} · ${esc(k ? k.name : '')}</div>
      <div class="small">Lot <b>${esc(next.a.lot)}</b> · Exp ${next.a.exp} ${expBadge(next.a.exp)}</div>
      <div style="font-size:1.6rem;font-weight:800;margin:8px 0">${fmt(next.a.qty)} ${esc(k ? k.unit : '')}</div>
      <label>① 로케이션 바코드 스캔</label><input id="pkLoc" class="scan" autocomplete="off" placeholder="${esc(next.a.loc)}">
      <div style="height:8px"></div><label>② 상품 바코드 스캔</label><input id="pkSku" class="scan" autocomplete="off" placeholder="${esc(k ? k.barcode : '')}" disabled>
      <div style="height:8px"></div><label>③ 실제 피킹 수량</label><input id="pkQty" type="number" min="0" max="${next.a.qty}" value="${next.a.qty}" inputmode="numeric" disabled>
      <div style="height:12px"></div><button class="btn big" id="pkOk" disabled>피킹 확인</button>
      <div style="height:8px"></div><button class="btn ghost sm" id="pkManual">스캐너 없이 수동 확인</button>
    </div>` : `<div class="card" style="text-align:center"><div style="font-size:3rem">🎉</div><h3>피킹 완료!</h3><p class="muted">사무실에서 <b>Ship and Close Order</b> 를 누르면 주문이 종료됩니다.</p><button class="btn" id="pkBack2">목록으로</button></div>`}
    <div class="grid-box" style="margin-top:14px"><div class="grid-bar"><b>전체 피킹 목록</b></div><div class="table-wrap"><table><thead><tr><th></th><th>Location</th><th>SKU</th><th>Lot</th><th>Exp</th><th class="num">Qty</th><th class="num">Picked</th></tr></thead><tbody>
      ${order.map(({ a }) => `<tr><td><span class="chk ${a.done ? 'done' : ''}"></span></td><td class="mono"><b>${esc(a.loc)}</b></td><td class="mono">${esc(a.sku)}</td><td>${esc(a.lot)}</td><td>${a.exp}</td><td class="num">${fmt(a.qty)}</td><td class="num">${a.done ? (a.picked < a.qty ? `<span class="badge b-bad">${fmt(a.picked)}</span>` : fmt(a.picked)) : '-'}</td></tr>`).join('')}
    </tbody></table></div></div>`;
  $('#pkBack').onclick = () => go('pick');
  if (!next) { $('#pkBack2').onclick = () => go('pick'); return; }
  const L = $('#pkLoc'), S = $('#pkSku'), Q = $('#pkQty'), OK = $('#pkOk');
  L.focus();
  L.addEventListener('keydown', e => { if (e.key !== 'Enter') return; e.preventDefault();
    if (L.value.trim().toUpperCase() === next.a.loc.toUpperCase()) { L.style.borderColor = 'var(--ok)'; S.disabled = false; S.focus(); }
    else { toast(`위치가 다릅니다! ${next.a.loc} 로 가세요`, 'err'); L.select(); } });
  S.addEventListener('keydown', e => { if (e.key !== 'Enter') return; e.preventDefault();
    const f = findSku(S.value, o.client);
    if (f && f.sku === next.a.sku) { S.style.borderColor = 'var(--ok)'; Q.disabled = false; OK.disabled = false; Q.focus(); Q.select(); }
    else { toast('다른 상품입니다! 바코드를 확인하세요', 'err'); S.select(); } });
  Q.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); OK.click(); } });
  $('#pkManual').onclick = () => ask('바코드 확인 없이 진행할까요?\n위치와 상품을 눈으로 꼭 확인하세요.', () => { L.value = next.a.loc; S.disabled = false; S.value = next.a.sku; Q.disabled = false; OK.disabled = false; Q.focus(); }, '수동 확인');
  OK.onclick = () => {
    const q = parseInt(Q.value);
    if (!(q >= 0 && q <= next.a.qty)) return toast(`수량은 0~${next.a.qty} 사이`, 'err');
    if (q < next.a.qty && !OK._short) { ask(`지시 ${next.a.qty}개 중 ${q}개만 피킹합니다 (부족 ${next.a.qty - q}).\n계속할까요?`, () => { OK._short = true; OK.click(); }, '부족 피킹 확정'); return; }
    const a = o.alloc[next.i], s = db.stock.find(x => x.id === a.stockId);
    if (s) { s.qty -= q; s.reserved = Math.max(0, s.reserved - a.qty); }
    a.picked = q; a.done = true; a.pickedBy = user.name;
    o.status = o.alloc.every(x => x.done) ? 'picked' : 'picking';
    cleanStock(); log('피킹', `${o.no} ${a.sku} ${a.lot} @${a.loc} ${q}/${a.qty}`);
    save(); toast(`✔ ${a.loc} ${a.sku} ${q}개`, 'ok'); VIEWS.pick(o.no);
  };
};

VIEWS.dash = () => {

  const near = s.filter(x => x.qty > 0 && daysLeft(x.exp) <= 30).sort((a, b) => a.exp.localeCompare(b.exp));
  const expired = near.filter(x => daysLeft(x.exp) < 0);
  const cnt = st => db.orders.filter(o => o.status === st).length;
  const bySku = db.skus.map(k => {
    const ls = s.filter(x => x.client === k.client && x.sku === k.sku);
    return { k, total: ls.reduce((a, x) => a + x.qty, 0), res: ls.reduce((a, x) => a + x.reserved, 0),
      hold: ls.filter(x => x.hold || isHoldLoc(x.loc)).reduce((a, x) => a + x.qty, 0),
      av: ls.filter(x => !isHoldLoc(x.loc) && daysLeft(x.exp) >= 0).reduce((a, x) => a + avail(x), 0),
      first: ls.filter(x => x.qty > 0).map(x => x.exp).sort()[0] };
  });
  $('#view').innerHTML = `
  <h2>Dashboard <span class="muted small">${todayStr()} 기준</span></h2>
  <div class="kpis">
    <div class="kpi"><div class="l">Open (미할당)</div><div class="v">${cnt('open')}</div></div>
    <div class="kpi"><div class="l">Allocated · Picking</div><div class="v">${cnt('allocated') + cnt('partial') + cnt('picking')}</div></div>
    <div class="kpi"><div class="l">Picked (출고 대기)</div><div class="v">${cnt('picked')}</div></div>
    <div class="kpi"><div class="l">Closed (출고완료)</div><div class="v">${cnt('closed')}</div></div>
    <div class="kpi"><div class="l">총 재고 수량</div><div class="v">${fmt(total)}</div></div>
    <div class="kpi hold"><div class="l">보류(Hold) 수량</div><div class="v">${fmt(holdQ)}</div></div>
    <div class="kpi warn"><div class="l">유통기한 30일 이내 로트</div><div class="v">${near.length}</div></div>
    <div class="kpi bad"><div class="l">유통기한 만료 로트</div><div class="v">${expired.length}</div></div>
  </div>
  <div class="grid-box" style="margin-bottom:14px"><div class="grid-bar"><b>SKU별 재고 요약</b></div>
    <div class="table-wrap"><table><thead><tr><th>Customer</th><th>SKU</th><th>Description</th><th class="num">On Hand</th><th class="num">Available</th><th class="num">Allocated</th><th class="num">Hold</th><th>Earliest Exp</th></tr></thead><tbody>
    ${bySku.map(r => `<tr><td>${esc((clientOf(r.k.client) || {}).name)}</td><td class="mono">${esc(r.k.sku)}</td><td>${esc(r.k.name)}</td><td class="num">${fmt(r.total)}</td><td class="num"><b>${fmt(r.av)}</b></td><td class="num">${fmt(r.res)}</td><td class="num">${r.hold ? `<span class="badge b-hold">${fmt(r.hold)}</span>` : '0'}</td><td>${r.first ? r.first + ' ' + expBadge(r.first) : '-'}</td></tr>`).join('')}
    </tbody></table></div></div>
  <div class="grid-box"><div class="grid-bar"><b>⏰ 유통기한 임박·만료 (30일 이내)</b></div>
    ${near.length ? `<div class="table-wrap"><table><thead><tr><th>SKU</th><th>Lot</th><th>Location</th><th>Expiration</th><th class="num">Qty</th></tr></thead><tbody>
    ${near.map(x => `<tr><td class="mono">${esc(x.sku)}</td><td>${esc(x.lot)}</td><td class="mono">${esc(x.loc)}</td><td>${x.exp} ${expBadge(x.exp)}</td><td class="num">${fmt(x.qty)}</td></tr>`).join('')}

function moveForm(id, after) {
  const s = db.stock.find(x => x.id === id); if (!s) return;
  const max = s.hold ? s.qty : s.qty - s.reserved;
  openModal(`<h3>🔁 Location Move</h3>
    <p class="small"><b class="mono">${esc(s.sku)}</b> ${esc(skuName(s.client, s.sku))}<br>Lot ${esc(s.lot)} · ${s.exp}<br>From <b class="mono">${esc(s.loc)}</b> · 이동가능 <b>${fmt(max)}</b></p>

    <div style="height:8px"></div><label>To Location (스캔)</label><input id="mvTo" class="scan" autocomplete="off" placeholder="예: B-01-04" autofocus>
    <div class="small muted" id="mvHint" style="margin-top:4px"></div>
    <div style="height:14px"></div><div class="btns" style="justify-content:flex-end"><button class="btn ghost" onclick="closeModal()">취소</button><button class="btn" id="mvOk">Move</button></div>`, () => {

    enterChain(['mvQty'], () => $('#mvOk').click());
    $('#mvTo').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('#mvOk').click(); } });
    $('#mvOk').onclick = () => {

/* =========================================================
   공유 데이터 (링크 버전: 모든 기기·직원이 같은 데이터를 실시간으로 봄)
   PC 파일 버전은 지금처럼 이 브라우저 안(localStorage)에 저장

const SYNC = { on: false, store: null, ready: false, readOnly: false, synced: {}, meta: null, want: new Map(), flying: new Set(), pauseUntil: 0, failed: 0, waitStart: false };
const SYNC_COLLS = ['clients', 'skus', 'locations', 'stock', 'orders', 'logs'];
const SYNC_KEY = {
  clients: x => x.code, skus: x => x.client + '|' + x.sku, locations: x => x.code,
  stock: x => x.id, orders: x => x.no, logs: x => x.id
};
const SYNC_SORT = {
  clients: (a, b) => String(a.code).localeCompare(b.code), skus: (a, b) => String(a.client + a.sku).localeCompare(b.client + b.sku),
  locations: (a, b) => String(a.code).localeCompare(b.code), stock: (a, b) => String(a.id).localeCompare(b.id),
  orders: (a, b) => (+a.no || 0) - (+b.no || 0), logs: (a, b) => (b.t || 0) - (a.t || 0)

const docId = s => String(s).replace(/[^A-Za-z0-9_\-:@+]/g, c => '~' + c.charCodeAt(0).toString(16) + '.');
function emptyDb() { return { clients: [], skus: [], locations: [], stock: [], orders: [], logs: [], favs: [], txnSeq: 9943500, settings: { warehouse: 'Main WH' }, masterPrinted: {}, version: 2 }; }
function metaJson(d) { return JSON.stringify({ txnSeq: d.txnSeq || 9943500, settings: d.settings || {}, favs: d.favs || [], masterPrinted: d.masterPrinted || {}, version: d.version || 2 }); }
function collMap(coll, d) { const m = new Map(); (d[coll] || []).forEach(x => m.set(docId(SYNC_KEY[coll](x)), JSON.stringify(x))); return m; }

function syncPush() {
  if (SYNC.readOnly) { toast('보기 전용 권한이라 저장되지 않았어요', 'err'); return; }
  db.logs.forEach(l => { if (!l.id) l.id = uid(); if (!l.t) l.t = Date.now(); });
  SYNC_COLLS.forEach(coll => {
    const cur = collMap(coll, db), prev = SYNC.synced[coll] || new Map();
    cur.forEach((js, id) => { if (prev.get(id) !== js) SYNC.want.set(coll + '/' + id, js); });
    prev.forEach((js, id) => { if (!cur.has(id)) SYNC.want.set(coll + '/' + id, null); });
    SYNC.synced[coll] = cur;
  });
  const mj = metaJson(db);
  if (mj !== SYNC.meta) { SYNC.meta = mj; SYNC.want.set('meta/main', mj); }
  pump();
}
function pump() {
  syncBadge();
  if (Date.now() < SYNC.pauseUntil) return;
  for (const [path, js] of SYNC.want) {
    if (SYNC.flying.size >= 6) break;
    if (SYNC.flying.has(path)) continue;
    SYNC.want.delete(path); SYNC.flying.add(path);
    let ref; try { ref = SYNC.store.doc(path); } catch (e) { SYNC.flying.delete(path); continue; }
    (js === null ? ref.delete() : ref.set(JSON.parse(js))).then(() => { SYNC.failed = 0; }, e => {
      const code = e && e.code;
      if (code === 'invalid_argument' || code === 'transform_error') { toast('저장이 거부됐어요. 편집 권한이 있는 계정인지 확인해주세요', 'err'); return; }
      if (code === 'quota_exceeded') { toast('공유 저장 공간이 가득 찼어요. 오래된 데이터를 정리해야 해요', 'err'); return; }
      if (code === 'revoked' || code === 'not_granted' || code === 'capability_disabled') { toast('공유 저장소 연결이 끊겼어요. 페이지를 다시 열어주세요', 'err'); return; }
      if (!SYNC.want.has(path)) SYNC.want.set(path, js);
      SYNC.failed++; SYNC.pauseUntil = Date.now() + Math.min(15000, 1000 * SYNC.failed) + Math.random() * 800;
      setTimeout(pump, SYNC.pauseUntil - Date.now() + 20);
    }).finally(() => { SYNC.flying.delete(path); pump(); });
  }
}
function syncBadge() {
  const b = $('#syncBadge'); if (!b) return;
  if (!SYNC.on) { b.textContent = '💾 이 기기에만 저장'; b.className = 'syncb local'; return; }
  const n = SYNC.want.size + SYNC.flying.size;
  if (SYNC.readOnly) { b.textContent = '👁 보기 전용'; b.className = 'syncb warn'; }
  else if (n) { b.textContent = `☁ 저장 중… ${n}`; b.className = 'syncb busy'; }
  else { b.textContent = '☁ 공유됨'; b.className = 'syncb ok'; }
}
window.addEventListener('beforeunload', e => { if (SYNC.on && (SYNC.want.size || SYNC.flying.size)) { e.preventDefault(); e.returnValue = ''; } });

function isPending(coll, id) { const p = coll + '/' + id; return SYNC.want.has(p) || SYNC.flying.has(p); }
function applySnap(coll, snap) {
  const prev = SYNC.synced[coll] || new Map(), out = new Map();
  snap.docs.forEach(d => { if (d.exists) out.set(d.id, JSON.stringify(d.data())); });
  // 아직 서버에 올라가지 않은 이 기기의 변경은 그대로 유지
  prev.forEach((js, id) => { if (isPending(coll, id)) out.set(id, js); });
  out.forEach((js, id) => { if (isPending(coll, id) && !prev.has(id)) out.delete(id); });
  let changed = out.size !== prev.size;
  if (!changed) for (const [id, js] of out) if (prev.get(id) !== js) { changed = true; break; }
  SYNC.synced[coll] = out;
  if (!changed && db[coll]) return false;

}
function applyMeta(snap) {

  db.txnSeq = Math.max(m.txnSeq, db.txnSeq || 0); db.settings = m.settings; db.favs = m.favs; db.masterPrinted = m.masterPrinted; db.version = m.version;
  return true;
}
function migrate(d) {
  d.settings = d.settings || { warehouse: 'Main WH' };
  if (!d.settings.warehouse) d.settings.warehouse = 'Main WH';
  d.txnSeq = d.txnSeq || 9943500;
  ['clients', 'skus', 'locations', 'stock', 'orders', 'logs', 'favs'].forEach(k => d[k] = d[k] || []);
  d.orders.forEach(o => {
    if (o.status === 'shipped') o.status = 'closed';
    o.contact = o.contact || { company: o.customer || '', name: '', phone: '', email: '', addr1: '', addr2: '', city: '', state: '', zip: '', country: 'KR' };
    o.carrier = o.carrier || { carrier: '', service: '', billing: 'Prepaid', tracking: '', scac: '', notes: '' };
    o.charges = o.charges || []; o.ref = o.ref || o.memo || ''; o.po = o.po || ''; o.type = o.type || 'Unspecified';
    o.warehouse = o.warehouse || d.settings.warehouse; o.lines = o.lines || []; o.alloc = o.alloc || []; o.result = o.result || [];
    o.billing = o.billing || { same: true }; o.notes = o.notes || ''; o.vendor = o.vendor || ''; o.printCount = o.printCount || 0;
    o.createdDate = o.createdDate || todayStr(); o.carrier.account = o.carrier.account || '';
  });
  d.skus.forEach(k => { if (k.cuft == null) k.cuft = 0; if (k.lbs == null) k.lbs = 0; if (!k.packPer) k.packPer = 1; if (!k.dimUnit) k.dimUnit = 'Carton'; });
  d.logs.forEach((l, i) => { if (!l.id) l.id = uid() + i; if (!l.t) l.t = Date.now() - i; });
  return d;
}

function initData() { return initData._p || (initData._p = initDataOnce()); }
async function initDataOnce() {

    const slow = setTimeout(() => { $('#loadMsg') && ($('#loadMsg').textContent = '공유 데이터 연결이 느려요. 인터넷 연결을 확인해주세요. 계속 기다리는 중…'); }, 10000);

      (coll === 'logs' ? store.collection(coll).orderBy('t', 'desc').limit(500) : store.collection(coll)).onSnapshot(snap => {
        const ch = applySnap(coll, snap);
        if (!got.has(coll)) { first(coll); return; }

    });

      const ch = applyMeta(snap);

          if (x.packUnit) s.dimUnit = x.packUnit; if (x.packQty > 0) s.packPer = Math.round(x.packQty);
          if (x.len > 0 && x.wid > 0 && x.hgt > 0) s.cuft = +(x.len * x.wid * x.hgt / 1728).toFixed(4);
          else if (x.invLen > 0 && x.invWid > 0 && x.invHgt > 0 && s.packPer > 0) s.cuft = +(x.invLen * x.invWid * x.invHgt / 1728 / s.packPer).toFixed(4);
          if (x.wt > 0) s.lbs = +x.wt; else if (x.invWt > 0 && s.packPer > 0) s.lbs = +(x.invWt / s.packPer).toFixed(3);
          if (x.trackLot) s.trackLot = x.trackLot; if (x.trackExp) s.trackExp = x.trackExp;
          if (!x.ex) { db.skus.push(s); nNew++; } else nUpd++;
        });
        log('Item Import', `${file}: 추가 ${nNew} · 업데이트 ${nUpd}${nSkip ? ' · 건너뜀 ' + nSkip : ''}`);
        save(); closeModal(); toast(`SKU 추가 ${nNew}개 · 업데이트 ${nUpd}개`, 'ok'); if (page === 'items') VIEWS.items();
      }
    };
  });
}

/* 링크 버전: 파일 받기 (백업·CSV·인쇄용 파일) */
async function saveFile(name, text, type) {
  if (window.IS_LINK) {
    let dl = null; try { dl = await window.claude.use('downloads'); } catch (e) { }
    if (!dl) { toast('이 화면에서는 파일 받기를 쓸 수 없어요', 'err'); return; }
    try { await dl.save({ filename: name, data: text }); toast('파일을 받았어요', 'ok'); }
    catch (e) { if (e && e.code !== 'declined') toast('파일 받기 실패 (' + (e.code || '') + ')', 'err'); }
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function printableDoc(title, html) {

}

/* =========================================================
   독립 웹사이트 버전: Firebase (이메일·비밀번호 로그인 + Firestore 공유 저장)
   window.FIREBASE_CONFIG 가 있을 때만 동작
   ========================================================= */
const FB = { on: !!window.FIREBASE_CONFIG, auth: null, fs: null, user: null };
function fbCode(e) {
  const c = String(e && e.code || '').replace(/^firestore\//, '');
  return { 'permission-denied': 'invalid_argument', 'unauthenticated': 'invalid_argument', 'invalid-argument': 'invalid_argument', 'resource-exhausted': 'resource_exhausted', 'unavailable': 'unavailable', 'deadline-exceeded': 'unavailable' }[c] || 'unavailable';
}
function fbStore(fs) {
  const wrapErr = p => p.catch(e => { throw { code: fbCode(e), message: e && e.message }; });
  const qsnap = s => ({ docs: s.docs.map(d => ({ id: d.id, exists: true, data: () => d.data() })), size: s.size, empty: s.empty, metadata: s.metadata });
  const wrapQ = q => ({
    orderBy: (f, d) => wrapQ(q.orderBy(f, d)), limit: n => wrapQ(q.limit(n)),
    onSnapshot: (next, err) => q.onSnapshot(s => next(qsnap(s)), e => err && err({ code: fbCode(e), message: e.message }))
  });
  return {
    collection: c => wrapQ(fs.collection(c)),
    doc: p => { const r = fs.doc(p); return {
      set: d => wrapErr(r.set(d)), delete: () => wrapErr(r.delete()),
      onSnapshot: (next, err) => r.onSnapshot(s => next({ id: s.id, exists: s.exists, data: () => s.data() }), e => err && err({ code: fbCode(e), message: e.message })) }; }
  };
}

const I18N_KEYS = Object.keys(I18N_EN).sort((a, b) => b.length - a.length);
const HANGUL = /[가-힣]/;
const trCache = new Map();
function tr(s) {
  if (LANG !== 'en' || !s || !HANGUL.test(s)) return s;
  if (trCache.has(s)) return trCache.get(s);
  const t0 = s.trim(), EX = { '줄': 'Row', '개': 'pcs', '건': '', '일': 'days' };
  if (EX[t0] != null) return s.replace(t0, EX[t0]);
  let r = s;
  for (const k of I18N_KEYS) if (r.includes(k)) r = r.split(k).join(I18N_EN[k]);
  r = r.replace(/(\d[\d,]*)\s*건/g, '$1').replace(/(\d[\d,]*)\s*개/g, '$1 pcs').replace(/(\d[\d,]*)\s*줄/g, '$1 lines').replace(/(\d[\d,]*)\s*일/g, '$1 days');
  if (trCache.size > 5000) trCache.clear();
  trCache.set(s, r); return r;
}
const TR_SKIP = { SCRIPT: 1, STYLE: 1, TEXTAREA: 1 };
function trAttrs(e) { ['placeholder', 'title'].forEach(a => { const v = e.getAttribute && e.getAttribute(a); if (v && HANGUL.test(v)) { const r = tr(v); if (r !== v) e.setAttribute(a, r); } }); }
function trNode(root) {
  if (LANG !== 'en' || !root) return;
  if (root.nodeType === 3) { const p = root.parentNode; if (p && TR_SKIP[p.nodeName]) return; const v = root.nodeValue; if (HANGUL.test(v)) { const r = tr(v); if (r !== v) root.nodeValue = r; } return; }
  if (root.nodeType !== 1 || TR_SKIP[root.nodeName]) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => (n.parentNode && TR_SKIP[n.parentNode.nodeName]) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
  const list = []; let n; while ((n = w.nextNode())) list.push(n);
  list.forEach(trNode);
  trAttrs(root); root.querySelectorAll('[placeholder],[title]').forEach(trAttrs);
}
function setLang(l) { try { localStorage.setItem('coverland_lang', l); } catch (e) { } location.reload(); }
document.documentElement.lang = LANG;
if (LANG === 'en') {
  new MutationObserver(ms => { for (const m of ms) { if (m.type === 'characterData') trNode(m.target); else m.addedNodes.forEach(trNode); } })
    .observe(document.body, { childList: true, characterData: true, subtree: true });
  trNode(document.body); document.title = tr(document.title);
}
$$('[data-lang]').forEach(b => { b.classList.toggle('on', b.dataset.lang === LANG); b.onclick = () => setLang(b.dataset.lang); });
$('#langBtn').textContent = LANG === 'en' ? '한국어' : 'English';
$('#langBtn').onclick = () => setLang(LANG === 'en' ? 'ko' : 'en');

try { const u = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); if (u && u.name) { user = u; SYNC.waitStart = true; } } catch (e) { }
if (!user) $('#loginName').focus();

  if (SYNC.waitStart && user) startApp();
}, err => { $('#loadMsg').textContent = '데이터를 불러오지 못했어요. 페이지를 다시 열어주세요.'; });
